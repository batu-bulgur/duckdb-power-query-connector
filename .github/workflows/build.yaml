name: Build connector

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6

      - uses: microsoft/setup-msbuild@v2

      # DuckDB.proj's BuildMez target zips the connector into bin\AnyCPU\Debug\DuckDB.mez.
      - name: Build .mez
        shell: pwsh
        run: |
          msbuild DuckDB.proj
          Copy-Item bin\AnyCPU\Debug\DuckDB.mez duckdb-power-query-connector.mez

      - uses: actions/upload-artifact@v7
        with:
          name: duckdb-power-query-connector
          path: duckdb-power-query-connector.mez
          if-no-files-found: error

  # The same headless commands used locally validate results, SQL folding, and
  # ODBC row counts. PQTest's JSON status is checked even if its process exits 0.
  smoke-test:
    needs: build
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: duckdb-power-query-connector

      - name: Install DuckDB ODBC driver
        shell: pwsh
        run: |
          # Register the "DuckDB Driver" that DuckDB.pq references straight into the registry.
          # odbc_install.exe blocks on an interactive prompt on headless runners; these keys
          # are all it would write anyway. $ProgressPreference speeds up Invoke-WebRequest.
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory .agent\ci-odbc -Force | Out-Null
          $zip = ".agent\ci-odbc\duckdb_odbc-windows-amd64.zip"
          Invoke-WebRequest "https://github.com/duckdb/duckdb-odbc/releases/download/v1.4.4.0/$zip" -OutFile $zip
          tar -xf $zip -C .agent\ci-odbc
          $dir = (Resolve-Path .agent\ci-odbc).Path

          $inst = "HKLM:\SOFTWARE\ODBC\ODBCINST.INI"
          New-Item "$inst\DuckDB Driver" -Force | Out-Null
          Set-ItemProperty "$inst\DuckDB Driver" Driver "$dir\duckdb_odbc.dll"
          Set-ItemProperty "$inst\DuckDB Driver" Setup  "$dir\duckdb_odbc_setup.dll"
          New-Item "$inst\ODBC Drivers" -Force | Out-Null
          Set-ItemProperty "$inst\ODBC Drivers" "DuckDB Driver" "Installed"

      - name: Install pinned Power Query SDK locally
        shell: pwsh
        run: |
          ./tools/dev.ps1 bootstrap
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Functional and folding regression tests
        shell: pwsh
        run: |
          # Seed through the same ODBC engine instead of downloading a separate CLI.
          # Test source files stay untouched; substituted queries live under .agent.
          ./tools/dev.ps1 verify -Connector ./duckdb-power-query-connector.mez
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve synthetic test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-evidence
          path: |
            .agent/test/**/summary.json
            .agent/test/**/*.json
            .agent/test/**/*.odbc.diagnostics
            .agent/negative-controls/**/*.json
          if-no-files-found: ignore
          include-hidden-files: true
