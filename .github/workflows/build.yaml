name: Build connector

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Supersede old PR checks, but preserve every versioned main commit's build.
  group: connector-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 10
    outputs:
      validation-scope: ${{ steps.validation.outputs.scope }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate version policy
        shell: pwsh
        env:
          VERSION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          ./tools/Test-Versioning.ps1
          $baseRef = if ($env:VERSION_BASE) { $env:VERSION_BASE } else { 'HEAD^' }
          ./tools/Test-Version.ps1 -BaseRef $baseRef

      - name: Select required validation
        id: validation
        shell: pwsh
        env:
          VERSION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          ./tools/Test-ValidationScope.ps1
          $baseRef = if ($env:VERSION_BASE) { $env:VERSION_BASE } else { 'HEAD^' }
          ./tools/Verify-Change.ps1 -BaseRef $baseRef -ScopeOnly -GitHubOutput -ForceFull:($env:FORCE_FULL -eq 'true')

      - uses: microsoft/setup-msbuild@v2

      # DuckDB.proj's BuildMez target zips the connector into bin\AnyCPU\Debug\DuckDB.mez.
      - name: Build .mez
        shell: pwsh
        run: |
          msbuild DuckDB.proj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item bin\AnyCPU\Debug\DuckDB.mez duckdb-power-query-connector.mez

      - uses: actions/upload-artifact@v7
        with:
          name: duckdb-power-query-connector
          path: duckdb-power-query-connector.mez
          if-no-files-found: error

  # Always check this head's package. Runtime scope additionally validates
  # results, SQL folding and ODBC rows; metadata scope does not replay M suites.
  smoke-test:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: duckdb-power-query-connector

      - name: Install DuckDB ODBC driver
        if: needs.build.outputs.validation-scope == 'full'
        shell: pwsh
        run: |
          # Register the "DuckDB Driver" that DuckDB.pq references straight into the registry.
          # odbc_install.exe blocks on an interactive prompt on headless runners; these keys
          # are all it would write anyway. $ProgressPreference speeds up Invoke-WebRequest.
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory .agent\ci-odbc -Force | Out-Null
          $toolchain = Get-Content ./tools/toolchain.json -Raw | ConvertFrom-Json
          $asset = "duckdb_odbc-windows-amd64.zip"
          $zip = Join-Path .agent\ci-odbc $asset
          Invoke-WebRequest "https://github.com/duckdb/duckdb-odbc/releases/download/v$($toolchain.ciOdbcVersion)/$asset" -OutFile $zip
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant() -cne $toolchain.ciOdbcSha256) {
            throw 'DuckDB ODBC download differs from the pinned official asset digest.'
          }
          tar -xf $zip -C .agent\ci-odbc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dir = (Resolve-Path .agent\ci-odbc).Path

          $inst = "HKLM:\SOFTWARE\ODBC\ODBCINST.INI"
          New-Item "$inst\DuckDB Driver" -Force | Out-Null
          Set-ItemProperty "$inst\DuckDB Driver" Driver "$dir\duckdb_odbc.dll"
          Set-ItemProperty "$inst\DuckDB Driver" Setup  "$dir\duckdb_odbc_setup.dll"
          New-Item "$inst\ODBC Drivers" -Force | Out-Null
          Set-ItemProperty "$inst\ODBC Drivers" "DuckDB Driver" "Installed"

      - name: Install pinned Power Query SDK locally
        shell: pwsh
        run: |
          ./tools/dev.ps1 bootstrap
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run required package or runtime validation
        shell: pwsh
        run: |
          # Seed through the same ODBC engine instead of downloading a separate CLI.
          # Test source files stay untouched; substituted queries live under .agent.
          ./tools/Test-Version.ps1 -Connector ./duckdb-power-query-connector.mez
          if ('${{ needs.build.outputs.validation-scope }}' -eq 'metadata') {
            ./tools/Test-ConnectorPackage.ps1 -Connector ./duckdb-power-query-connector.mez
          } else {
            ./tools/dev.ps1 verify -Parallel -Connector ./duckdb-power-query-connector.mez
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve synthetic test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-evidence
          path: |
            .agent/test/**/summary.json
            .agent/test/**/*.json
            .agent/test/**/*.odbc.diagnostics
            .agent/negative-controls/**/*.json
            .agent/parity-reference/**/*.json
            .agent/native-boundaries/**/*.json
            .agent/verification/**/*.log
            .agent/verification/**/summary.json
            .agent/package-checks/**/summary.json
          if-no-files-found: ignore
          include-hidden-files: true
